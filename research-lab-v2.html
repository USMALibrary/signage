<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Research Lab - USMA Library Signage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Open+Sans:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
  }

  /* ── HEADER ── */
  #header {
    width: 100%;
    height: 130px;
    background: #111;
    border-bottom: 4px solid rgb(200,170,100);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 60px;
  }

  #header-left {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  #logo {
    height: 80px;
    width: auto;
    filter: brightness(1.1);
  }

  #header-title {
    display: flex;
    flex-direction: column;
  }

  #header-title .lib-name {
    font-family: 'Oswald', sans-serif;
    font-size: 36px;
    font-weight: 600;
    color: rgb(200,170,100);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #header-title .lib-sub {
    font-size: 18px;
    color: #aaa;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
    margin-top: 2px;
  }

  /* ── MAIN CONTENT ── */
  #content {
    width: 100%;
    height: calc(1080px - 130px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #content img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div id="header-left">
    <img id="logo"
      src="https://libapps.s3.amazonaws.com/accounts/87070/images/USMALibraryLogo.png"
      alt="USMA Library"
      onerror="this.style.display='none'">
    <div id="header-title">
      <span class="lib-name">Jefferson Hall Library</span>
      <span class="lib-sub">United States Military Academy · West Point</span>
    </div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="content">
  <img src="https://usmalibrary.github.io/signage/images/Research_Lab_2-18__2_.png"
       alt="Library Research Help Space">
</div>

</body>
</html>
