<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Research Lab - USMA Library Signage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Open+Sans:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
  }

  /* ── HEADER ── */
  #header {
    width: 100%;
    height: 130px;
    background: #111;
    border-bottom: 4px solid rgb(200,170,100);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 60px;
  }

  #header-left {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  #logo {
    height: 80px;
    width: auto;
    filter: brightness(1.1);
  }

  #header-title {
    display: flex;
    flex-direction: column;
  }

  #header-title .lib-name {
    font-family: 'Oswald', sans-serif;
    font-size: 36px;
    font-weight: 600;
    color: rgb(200,170,100);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #header-title .lib-sub {
    font-size: 18px;
    color: #aaa;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
    margin-top: 2px;
  }

  /* ── MAIN CONTENT ── */
  #content {
    width: 100%;
    height: calc(1080px - 130px);
    display: flex;
  }

  /* ── LEFT PANEL ── */
  #left-panel {
    width: 55%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 60px 70px;
    justify-content: center;
  }

  #reserved-tag {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #0a0a0a;
    background: rgb(200,170,100);
    display: inline-block;
    padding: 8px 28px;
    margin-bottom: 36px;
    align-self: flex-start;
  }

  #room-title {
    font-family: 'Oswald', sans-serif;
    font-size: 96px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 3px;
    text-transform: uppercase;
    line-height: 1.05;
    margin-bottom: 10px;
  }

  #room-subtitle {
    font-family: 'Oswald', sans-serif;
    font-size: 48px;
    font-weight: 400;
    color: rgb(200,170,100);
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1.2;
    margin-bottom: 60px;
  }

  /* ── HELP SECTION ── */
  #help-section {
    background: #161616;
    border: 2px solid #2a2a2a;
    border-left: 5px solid rgb(200,170,100);
    padding: 40px 48px;
  }

  #help-heading {
    font-family: 'Oswald', sans-serif;
    font-size: 30px;
    font-weight: 600;
    color: rgb(200,170,100);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .help-item {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 22px;
  }

  .help-item:last-child {
    margin-bottom: 0;
  }

  .help-check {
    width: 36px;
    height: 36px;
    background: #1a4d1a;
    border: 2px solid #2d7a2d;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .help-check svg {
    width: 22px;
    height: 22px;
  }

  .help-text {
    font-size: 28px;
    font-weight: 300;
    color: #ddd;
    line-height: 1.3;
  }

  /* ── RIGHT PANEL ── */
  #right-panel {
    width: 45%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  #right-panel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: right center;
  }

  /* Fade edge into dark background */
  #right-panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 120px;
    height: 100%;
    background: linear-gradient(to right, #0a0a0a, transparent);
    z-index: 1;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div id="header-left">
    <img id="logo"
      src="https://libapps.s3.amazonaws.com/accounts/87070/images/USMALibraryLogo.png"
      alt="USMA Library"
      onerror="this.style.display='none'">
    <div id="header-title">
      <span class="lib-name">Jefferson Hall Library</span>
      <span class="lib-sub">United States Military Academy · West Point</span>
    </div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="content">

  <!-- LEFT: Text content -->
  <div id="left-panel">
    <div id="reserved-tag">Reserved</div>
    <div id="room-title">Library Research</div>
    <div id="room-subtitle">Help Space</div>

    <div id="help-section">
      <div id="help-heading">Here's How to Get Help</div>

      <div class="help-item">
        <div class="help-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6fcf6f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <span class="help-text">Knock on an open door</span>
      </div>

      <div class="help-item">
        <div class="help-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6fcf6f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <span class="help-text">Book an appointment</span>
      </div>

      <div class="help-item">
        <div class="help-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6fcf6f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <span class="help-text">Ask for help via the kiosk</span>
      </div>

      <div class="help-item">
        <div class="help-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6fcf6f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <span class="help-text">Sit at a table and a librarian will offer you help</span>
      </div>
    </div>
  </div>

  <!-- RIGHT: Photo -->
  <div id="right-panel">
    <img src="https://usmalibrary.github.io/signage/images/Research_Lab_2-18__2_.png"
         alt="Librarian helping cadets"
         onerror="this.style.display='none'">
  </div>

</div>

</body>
</html>
