<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>USMA Library – Elevator Display</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=Open+Sans:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold:  rgb(200, 170, 100);
    --black: #0a0a0a;
    --dark:  #111111;
    --mid:   #1a1a1a;
    --border:#2a2a2a;
    --text:  #f0f0f0;
    --muted: #888;
    --alert: #cf6f6f;
    --green: #6fcf6f;
    --blue:  #60a5fa;
  }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--black);
    font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  #header {
    width: 100%;
    height: 100px;
    background: var(--dark);
    border-bottom: 3px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px;
    flex-shrink: 0;
  }

  #header-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  #logo { height: 64px; width: auto; }

  #header-title .lib-name {
    font-family: 'Oswald', sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: block;
  }

  #header-title .lib-sub {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
    margin-top: 2px;
    display: block;
  }

  #header-center {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .hours-pill {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 1px;
    padding: 6px 18px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--mid);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .hours-pill .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .hours-pill .dot.open { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .hours-pill .dot.closed { background: var(--alert); box-shadow: 0 0 8px var(--alert); }

  .hours-pill .hours-label {
    color: var(--muted);
    font-weight: 300;
    font-size: 16px;
  }

  .hours-pill .hours-time {
    color: var(--text);
  }

  .hours-pill .hours-time.open { color: var(--green); }
  .hours-pill .hours-time.closed { color: var(--alert); }

  #header-right { text-align: right; }

  #clock {
    font-family: 'Oswald', sans-serif;
    font-size: 40px;
    font-weight: 400;
    color: #fff;
    letter-spacing: 2px;
    line-height: 1;
  }

  #date {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ── MAIN CONTENT ── */
  #content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 48px;
    text-align: center;
    position: relative;
  }

  /* ── NOTICE SLIDE ── */
  #notice-view {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Notice type styling */
  #notice-icon {
    margin-bottom: 20px;
    display: block;
  }

  #notice-icon img {
    height: 120px;
    width: auto;
  }

  #notice-title {
    font-family: 'Oswald', sans-serif;
    font-size: 52px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1.1;
    margin-bottom: 16px;
    max-width: 880px;
  }

  #notice-body {
    font-family: 'Open Sans', sans-serif;
    font-size: 28px;
    font-weight: 300;
    color: #ddd;
    line-height: 1.5;
    max-width: 800px;
  }

  /* Notice type accents */
  #content.type-alert { border-left: none; }
  #content.type-alert #notice-title { color: var(--alert); }

  #content.type-event #notice-title { color: var(--gold); }

  #content.type-info #notice-title { color: #60a5fa; }

  #content.type-welcome #notice-title { color: var(--gold); }

  /* Slide indicator dots */
  #slide-dots {
    position: absolute;
    bottom: 16px;
    display: flex;
    gap: 10px;
  }

  #slide-dots .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s;
  }

  #slide-dots .dot.active {
    background: var(--gold);
  }

  /* Fade transition */
  .fade-out {
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .fade-in {
    opacity: 1;
    transition: opacity 0.4s ease;
  }

  /* ── FOOTER ── */
  #footer {
    height: auto;
    min-height: 56px;
    background: var(--dark);
    border-top: 3px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 36px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }

  #footer-url {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--gold);
    letter-spacing: 2px;
  }

  #footer-helpdesk {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 300;
    color: #ccc;
    letter-spacing: 2px;
  }

  #footer-helpdesk span {
    color: var(--gold);
    font-weight: 600;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div id="header-left">
    <img id="logo"
      src="https://libapps.s3.amazonaws.com/accounts/87070/images/USMALibraryLogo.png"
      alt="USMA Library"
      onerror="this.style.display='none'">
    <div id="header-title">
      <span class="lib-name">Jefferson Hall Library</span>
      <span class="lib-sub">United States Military Academy · West Point</span>
    </div>
  </div>

  <div id="header-center">
    <div class="hours-pill">
      <span class="dot closed" id="hours-dot"></span>
      <span class="hours-label">Today</span>
      <span class="hours-time" id="hours-time">--</span>
    </div>
  </div>

  <div id="header-right">
    <div id="clock">--:-- --</div>
    <div id="date">--</div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="content" class="type-welcome">
  <div id="notice-view">
    <span id="notice-icon"><img src="https://libapps.s3.amazonaws.com/accounts/87070/images/USMALibraryLogo.png" alt="USMA Library"></span>
    <div id="notice-title">Welcome to the USMA Library</div>
    <div id="notice-body"></div>
  </div>
</div>

<!-- FOOTER -->
<div id="footer">
  <div id="footer-url">library.westpoint.edu</div>
  <div id="footer-helpdesk">Help Kiosk &nbsp;·&nbsp; <span>2nd Floor</span></div>
</div>

<script>
  var BASE = 'https://raw.githubusercontent.com/USMALibrary/signage/data/data/';

  /* ── XHR HELPER — silent on failure ── */
  function loadJSON(url, callback) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url + '?v=' + Date.now(), true);
    xhr.timeout = 10000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && xhr.status === 200) {
        try { callback(JSON.parse(xhr.responseText)); } catch(e) { /* silent */ }
      }
    };
    xhr.onerror = function() { /* silent — keep last good data */ };
    xhr.ontimeout = function() { /* silent */ };
    xhr.send();
  }

  /* ── CLOCK ── */
  function updateClock() {
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes().toString().padStart(2,'0');
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    document.getElementById('clock').textContent = h + ':' + m + ' ' + ampm;
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('date').textContent =
      days[now.getDay()].toUpperCase() + ' · ' + months[now.getMonth()].toUpperCase() + ' ' + now.getDate();
  }
  updateClock();
  setInterval(updateClock, 30000);

  /* ── FORMAT HOURS (24-hour / military time) ── */
  /* Build directly from the raw from/to hours array rather than the
     pre-rendered 12-hour string, so we don't have to re-parse AM/PM. */
  function to24(t) {
    if (!t) return '';
    var m = t.match(/(\d{1,2})(?::(\d{2}))?\s*([ap]m)/i);
    if (!m) return t;
    var hr = parseInt(m[1], 10);
    var min = m[2] || '00';
    var ampm = m[3].toLowerCase();
    if (ampm === 'pm' && hr !== 12) hr += 12;
    if (ampm === 'am' && hr === 12) hr = 0;
    return (hr < 10 ? '0' : '') + hr + min;
  }

  function fmtHoursMilitary(loc) {
    if (!loc.times || loc.times.status === 'closed' ||
        !loc.times.hours || !loc.times.hours.length) return 'Closed';
    return loc.times.hours
      .map(function(r) { return to24(r.from) + ' – ' + to24(r.to); })
      .join(' & ');
  }

  /* ── HOURS ── */
  /* currently_open in the feed reflects when the GitHub Actions workflow
     last ran, not the live time — always compute open/closed ourselves
     from the raw hours array, same as the other signage files. */
  function parseTimeToMinutes(t) {
    if (!t) return null;
    var m = t.match(/(\d{1,2})(?::(\d{2}))?\s*([ap]m)/i);
    if (!m) return null;
    var hr = parseInt(m[1], 10);
    var min = parseInt(m[2] || '0', 10);
    var ampm = m[3].toLowerCase();
    if (ampm === 'pm' && hr !== 12) hr += 12;
    if (ampm === 'am' && hr === 12) hr = 0;
    return hr * 60 + min;
  }

  function isLocationOpen(loc) {
    if (!loc.times || loc.times.status === 'closed' ||
        !loc.times.hours || !loc.times.hours.length) return false;
    var now = new Date();
    var nowMinutes = now.getHours() * 60 + now.getMinutes();
    return loc.times.hours.some(function(r) {
      var from = parseTimeToMinutes(r.from);
      var to = parseTimeToMinutes(r.to);
      if (from === null || to === null) return false;
      return nowMinutes >= from && nowMinutes < to;
    });
  }

  function loadHours() {
    loadJSON(BASE + 'hours-today.json', function(data) {
      if (!data.locations || !data.locations.length) return;
      var loc = data.locations[0];
      var isOpen = isLocationOpen(loc);
      var dot = document.getElementById('hours-dot');
      var time = document.getElementById('hours-time');
      dot.className = 'dot ' + (isOpen ? 'open' : 'closed');
      time.className = 'hours-time ' + (isOpen ? 'open' : 'closed');
      time.textContent = fmtHoursMilitary(loc);
    });
  }

  /* ── NOTICE SLIDE ROTATION ── */
  var NOTICE_DWELL = 8000;

  var defaultNotice = {
    icon: 'logo',
    title: 'Welcome to the USMA Library',
    body: '',
    type: 'welcome'
  };
  var notices = [defaultNotice];
  var slides = [];
  var currentSlide = 0;
  var advanceTimer = null;
  var rotationActive = false;

  function renderNotice(notice) {
    var icon = document.getElementById('notice-icon');
    var title = document.getElementById('notice-title');
    var body = document.getElementById('notice-body');

    var icons = {
      alert: '⚠️',
      event: '📅',
      info: 'ℹ️',
      holiday: '🎉',
      maintenance: '🔧',
      instruction: '🎓'
    };

    if (notice.icon === 'logo' || notice.type === 'welcome') {
      icon.innerHTML = '<img src="https://libapps.s3.amazonaws.com/accounts/87070/images/USMALibraryLogo.png" alt="USMA Library">';
    } else {
      icon.textContent = notice.icon || icons[notice.type] || 'ℹ️';
    }
    title.textContent = notice.title || '';
    body.textContent = notice.body || '';
  }

  function renderSlide(slide) {
    var content = document.getElementById('content');
    content.className = 'type-' + (slide.notice.type || 'info');
    renderNotice(slide.notice);
  }

  function renderDots() {
    var container = document.getElementById('slide-dots');
    if (!container) return;
    if (slides.length <= 1) {
      container.innerHTML = '';
      return;
    }
    var html = '';
    for (var i = 0; i < slides.length; i++) {
      html += '<div class="dot' + (i === currentSlide ? ' active' : '') + '"></div>';
    }
    container.innerHTML = html;
  }

  function scheduleAdvance() {
    if (advanceTimer) clearTimeout(advanceTimer);
    if (slides.length <= 1) { rotationActive = false; return; }
    rotationActive = true;
    advanceTimer = setTimeout(advanceSlide, NOTICE_DWELL);
  }

  function advanceSlide() {
    if (slides.length <= 1) { rotationActive = false; return; }
    var content = document.getElementById('content');
    content.classList.add('fade-out');
    content.classList.remove('fade-in');
    setTimeout(function() {
      currentSlide = (currentSlide + 1) % slides.length;
      renderSlide(slides[currentSlide]);
      renderDots();
      content.classList.remove('fade-out');
      content.classList.add('fade-in');
      scheduleAdvance();
    }, 400);
  }

  /* Rebuild the slide list from whatever notices have loaded, keeping the
     currently-shown slide's content in sync. Only (re)starts the rotation
     timer when it isn't already running -- notices refresh every 60s and
     the slide count can legitimately change between refreshes. */
  function rebuildSlides() {
    slides = notices.map(function(n) { return { kind: 'notice', notice: n }; });
    if (currentSlide >= slides.length) currentSlide = 0;

    if (!rotationActive && slides.length > 1) {
      renderSlide(slides[currentSlide]);
      scheduleAdvance();
    } else if (slides[currentSlide]) {
      renderNotice(slides[currentSlide].notice);
    }
    renderDots();
  }

  function loadNotices() {
    loadJSON(BASE + 'elevator-notices.json', function(data) {
      if (!data.notices || !data.notices.length) {
        notices = [defaultNotice];
      } else {
        // Filter by optional start/end dates
        var now = new Date();
        notices = data.notices.filter(function(n) {
          if (n.start && new Date(n.start) > now) return false;
          if (n.end && new Date(n.end) < now) return false;
          return true;
        });
        if (!notices.length) notices = [defaultNotice];
      }
      rebuildSlides();
    });
  }

  /* ── INIT ── */
  loadHours();
  loadNotices();

  // Refresh data every 60 seconds (silent on failure)
  setInterval(function() {
    loadHours();
    loadNotices();
  }, 60000);
</script>

<!-- Slide indicator dots -->
<div id="slide-dots" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:10;"></div>

</body>
</html>
