name: Alma Usage Feeds

on:
  schedule:
    # Once daily — Alma Analytics data refreshes overnight, so intraday polling
    # wouldn't show new numbers anyway. 11:00 UTC = ~7am ET, after the refresh.
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  update-usage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch circulation usage
        env:
          ALMA_API_KEY: ${{ secrets.ALMA_ANALYTICS_API_KEY }}
        run: python alma_usage.py

      - name: Fetch e-resource usage
        env:
          ALMA_API_KEY: ${{ secrets.ALMA_ANALYTICS_API_KEY }}
        run: python alma_eresource_usage.py

      - name: Fetch Scout (Primo VE) searches
        continue-on-error: true
        env:
          ALMA_API_KEY: ${{ secrets.PRIMO_ANALYTICS_API_KEY }}
          ALMA_API_BASE: https://api-na.hosted.exlibrisgroup.com/primo/v1/analytics/reports
          ALMA_REPORT_PATH: /shared/Primo United States Military Academy (West Point) 01USMA_INST/Reports/Signage/Scout Searches Daily
          ALMA_OUTPUT: data/scout-usage.json
          ALMA_METRIC_LABEL: searches
        run: python alma_usage.py

      - name: Fetch link resolver full-text clicks
        continue-on-error: true
        env:
          ALMA_API_KEY: ${{ secrets.ALMA_ANALYTICS_API_KEY }}
          ALMA_REPORT_PATH: /shared/United States Military Academy (West Point) 01USMA_INST/Reports/Signage/Link Resolver Daily
          ALMA_OUTPUT: data/linkresolver-usage.json
          ALMA_METRIC_LABEL: clicks
        run: python alma_usage.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/circulation-usage.json data/eresource-usage.json data/scout-usage.json data/linkresolver-usage.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Alma usage feeds $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin data
            git push origin data || {
              echo "Push failed, retrying after rebase..."
              git pull --rebase origin data
              git push origin data
            }
          fi
