name: Alma Circulation Usage Feed

on:
  schedule:
    # Once daily — Alma Analytics data refreshes overnight, so intraday polling
    # wouldn't show new numbers anyway. 11:00 UTC = ~7am ET, after the refresh.
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  update-usage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch circulation usage
        env:
          ALMA_API_KEY: ${{ secrets.ALMA_API_KEY }}
        run: python alma_usage.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/circulation-usage.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update circulation usage $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin data
            git push origin data || {
              echo "Push failed, retrying after rebase..."
              git pull --rebase origin data
              git push origin data
            }
          fi
