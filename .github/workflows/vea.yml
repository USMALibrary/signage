name: Vea Visitor Count Feed

# Manual dispatch only. GitHub delivers roughly 6 of 96 requested runs/day for
# this repo's crons, which is far too sparse for a live occupancy number that
# the sign flags STALE after 30 minutes. The scheduled copy of this feed runs
# from the Windows box that also runs the PaperCut task; this workflow is kept
# as a manual fallback.
on:
  workflow_dispatch:

concurrency:
  group: vea-visitor-count
  cancel-in-progress: false

jobs:
  update-visitor-count:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Vea visitor count
        env:
          VEA_CLIENT_ID: ${{ secrets.VEA_CLIENT_ID }}
          VEA_CLIENT_SECRET: ${{ secrets.VEA_CLIENT_SECRET }}
        run: python vea_visitor_count.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/visitor-count.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update visitor count $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin data
            git push origin data || {
              echo "Push failed, retrying after rebase..."
              git pull --rebase origin data
              git push origin data
            }
          fi
