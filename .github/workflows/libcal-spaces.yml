name: LibCal Space Bookings Feed

on:
  schedule:
    # Every 15 minutes during operating hours, offset by 10 min to stagger from fetch-hours
    - cron: '10-59/15 10-23 * * *'
    - cron: '10-59/15 0 * * *'
  workflow_dispatch:

jobs:
  update-bookings:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch space bookings
        env:
          LIBCAL_CLIENT_ID: ${{ secrets.LIBCAL_CLIENT_ID }}
          LIBCAL_CLIENT_SECRET: ${{ secrets.LIBCAL_CLIENT_SECRET }}
        run: python space_bookings.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/room-reservations.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update room reservations $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin data
            git push origin data || {
              echo "Push failed, retrying after rebase..."
              git pull --rebase origin data
              git push origin data
            }
          fi
