name: Clarity Website Sessions

on:
  schedule:
    # Once daily. The Clarity export covers the previous 24 hours, so a fixed
    # time keeps the daily numbers consistent. 10:15 UTC = ~5:15am ET.
    - cron: '15 10 * * *'
  workflow_dispatch:

jobs:
  update-sessions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Clarity website sessions
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: python clarity_sessions.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clarity-history.json data/website-sessions.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Clarity website sessions $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin data
            git push origin data || {
              echo "Push failed, retrying after rebase..."
              git pull --rebase origin data
              git push origin data
            }
          fi
